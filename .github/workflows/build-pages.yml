name: Build GitHub Pages site

# Rebuilds docs/ (the GitHub Pages folder) whenever the site source changes,
# so the live site always matches src/.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit rebuilt docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ already up to date"
          else
            git commit -m "Rebuild docs/ from source [skip ci]"
            git push
          fi
